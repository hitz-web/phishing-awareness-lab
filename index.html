
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram Demo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #fafafa;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 350px;
  max-width: 100%;
  text-align: center;
}

.card {
  background: white;
  border: 1px solid #dbdbdb;
  padding: 35px 35px 25px;
}

.logo {
  width: 65px;
  height: 65px;
  margin: 0 auto 15px;
  border-radius: 20px;
  background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
  display: flex;
  justify-content: center;
  align-items: center;
}

.camera {
  width: 33px;
  height: 33px;
  border: 3px solid white;
  border-radius: 10px;
  position: relative;
}

.camera:before {
  content: "";
  position: absolute;
  width: 12px;
  height: 12px;
  border: 3px solid white;
  border-radius: 50%;
  top: 7px;
  left: 7px;
}

.camera:after {
  content: "";
  position: absolute;
  width: 5px;
  height: 5px;
  background: white;
  border-radius: 50%;
  right: 4px;
  top: 4px;
}

h1 {
  font-size: 25px;
  letter-spacing: -1px;
  margin-bottom: 28px;
  color: #262626;
}

input {
  width: 100%;
  height: 42px;
  padding: 10px;
  margin-bottom: 7px;
  border: 1px solid #dbdbdb;
  border-radius: 4px;
  background: #fafafa;
  font-size: 12px;
}

.password {
  position: relative;
}

.password input {
  padding-right: 48px;
}

.toggle {
  position: absolute;
  right: 10px;
  top: 12px;
  font-size: 11px;
  cursor: pointer;
  color: #555;
}

button {
  width: 100%;
  border: 0;
  background: #3897f0;
  color: white;
  height: 35px;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
  transition: .2s;
}

button:hover {
  background: #1877d2;
}

button:active {
  transform: scale(.98);
}

.or {
  color: #888;
  font-size: 12px;
  margin: 23px 0;
}

.forgot {
  color: #385185;
  font-size: 12px;
}

.footer {
  background: white;
  border: 1px solid #dbdbdb;
  padding: 20px;
  margin-top: 10px;
  font-size: 13px;
}

.reveal {
  display: none;
  background: white;
  border: 1px solid #dbdbdb;
  padding: 30px 22px;
  margin-top: 10px;
  border-radius: 8px;
  animation: pop .5s ease;
}

@keyframes pop {
  from {opacity:0; transform:scale(.9);}
  to {opacity:1; transform:scale(1);}
}

.reveal h2 {
  color: #e1306c;
}

.reveal p {
  font-size: 14px;
  line-height: 1.6;
  color: #444;
}

.notice {
  font-size: 10px;
  color: #777;
  margin-top: 15px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="container">

  <div class="card" id="loginCard">

    <div class="logo">
      <div class="camera"></div>
    </div>

    <h1>Instagram</h1>

    <form id="loginForm">

      <input
        type="text"
        placeholder=" username or email"
        autocomplete="off"
        required
      >

      <div class="password">
        <input
          type="password"
          id="password"
          placeholder="password"
          autocomplete="off"
          required
        >
        <span class="toggle" id="toggle">Show</span>
      </div>

      <button type="submit">Log in</button>

    </form>

    <div class="or">──────── OR ────────</div>

    <div class="forgot">
      Forgotten password? <a href="#">Get help signing in.</a>
    </div>

    <div class="notice">
      
    </div>

  </div>

  

    <button onclick="location.reload()">
      Try Again
    </button>

  </div>

  

</div>

<script>
const form = document.getElementById("loginForm");

form.addEventListener("submit", function(event) {
  event.preventDefault();

  // Never access, save or transmit input values.
  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("reveal").style.display = "block";
});

document.getElementById("toggle").addEventListener("click", function() {
  const password = document.getElementById("password");

  password.type =
    password.type === "password" ? "text" : "password";

  this.textContent =
    password.type === "password" ? "Show" : "Hide";
});
</script>

</body>
</html>
